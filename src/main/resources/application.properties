# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=investment-management

# ===================================================================
# Database Configuration (H2 In-Memory for zero-dependency execution)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:investmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console configuration for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Server Port
# ===================================================================
server.port=8080

# ===================================================================
# DevTools
# ===================================================================
spring.devtools.restart.enabled=true
